<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="420"
  viewBox="0 0 1200 420"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">WORLD 01 // CODE KINGDOM</title>
  <desc id="desc">
    Animated purple cyber-pixel platform world featuring floating blocks,
    collectible commit coins, drifting clouds and an original pixel character.
  </desc>

  <defs>
    <!-- ===================== GRADIENTS ===================== -->

    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070312"/>
      <stop offset="55%" stop-color="#12072A"/>
      <stop offset="100%" stop-color="#1E0B3A"/>
    </linearGradient>

    <linearGradient id="mountain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#25104A"/>
      <stop offset="100%" stop-color="#100822"/>
    </linearGradient>

    <linearGradient id="platformTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="45%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#164E63"/>
    </linearGradient>

    <filter id="purpleGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- ===================== PIXEL BRICK ===================== -->

    <g id="brick">
      <rect width="42" height="28" rx="2" fill="#4C1D95"/>
      <rect x="3" y="3" width="36" height="22" fill="#6D28D9"/>
      <path d="M3 14H39M21 3V14M10 14V25M32 14V25"
            stroke="#A78BFA"
            stroke-width="2"/>
      <rect x="3" y="3" width="36" height="4" fill="#C084FC" opacity=".38"/>
    </g>

    <!-- ===================== COIN ===================== -->

    <g id="commitCoin">
      <ellipse cx="0" cy="0" rx="13" ry="16"
               fill="url(#coin)"
               stroke="#FDE68A"
               stroke-width="3"/>
      <rect x="-3" y="-8" width="6" height="16" rx="2" fill="#FFF7C2"/>
      <rect x="-8" y="-3" width="16" height="6" rx="2" fill="#FFF7C2" opacity=".3"/>
    </g>

    <!-- ===================== CLOUD ===================== -->

    <g id="cloud">
      <rect x="0" y="18" width="100" height="18" fill="#6D28D9"/>
      <rect x="14" y="10" width="28" height="18" fill="#8B5CF6"/>
      <rect x="38" y="0" width="35" height="30" fill="#A78BFA"/>
      <rect x="70" y="11" width="22" height="20" fill="#8B5CF6"/>
      <rect x="10" y="30" width="82" height="7" fill="#4C1D95"/>
      <rect x="40" y="5" width="26" height="6" fill="#C084FC" opacity=".65"/>
    </g>

    <!-- ===================== STAR ===================== -->

    <g id="star">
      <rect x="-2" y="-8" width="4" height="16" fill="#C084FC"/>
      <rect x="-8" y="-2" width="16" height="4" fill="#C084FC"/>
      <rect x="-3" y="-3" width="6" height="6" fill="#F5D0FE"/>
    </g>
  </defs>


  <!-- ===================================================== -->
  <!--                      BACKGROUND                       -->
  <!-- ===================================================== -->

  <rect width="1200" height="420" fill="url(#sky)"/>

  <rect
    x="10"
    y="10"
    width="1180"
    height="400"
    rx="10"
    fill="none"
    stroke="#8B5CF6"
    stroke-width="2"
    opacity=".45"
  />


  <!-- ===================== STARS ===================== -->

  <g opacity=".9">

    <g transform="translate(95 70)">
      <use href="#star"/>
      <animate
        attributeName="opacity"
        values=".25;1;.25"
        dur="2.3s"
        repeatCount="indefinite"
      />
    </g>

    <g transform="translate(180 115)">
      <use href="#star"/>
      <animate
        attributeName="opacity"
        values="1;.2;1"
        dur="3.1s"
        repeatCount="indefinite"
      />
    </g>

    <g transform="translate(320 60)">
      <use href="#star"/>
      <animate
        attributeName="opacity"
        values=".3;1;.3"
        dur="1.8s"
        repeatCount="indefinite"
      />
    </g>

    <g transform="translate(520 105)">
      <use href="#star"/>
      <animate
        attributeName="opacity"
        values="1;.25;1"
        dur="2.8s"
        repeatCount="indefinite"
      />
    </g>

    <g transform="translate(710 65)">
      <use href="#star"/>
      <animate
        attributeName="opacity"
        values=".2;1;.2"
        dur="2.1s"
        repeatCount="indefinite"
      />
    </g>

    <g transform="translate(890 110)">
      <use href="#star"/>
      <animate
        attributeName="opacity"
        values="1;.25;1"
        dur="3.4s"
        repeatCount="indefinite"
      />
    </g>

    <g transform="translate(1080 70)">
      <use href="#star"/>
      <animate
        attributeName="opacity"
        values=".3;1;.3"
        dur="2.5s"
        repeatCount="indefinite"
      />
    </g>

  </g>


  <!-- ===================== MOON ===================== -->

  <circle
    cx="1025"
    cy="105"
    r="46"
    fill="#8B5CF6"
    opacity=".28"
    filter="url(#purpleGlow)"
  />

  <circle
    cx="1012"
    cy="92"
    r="36"
    fill="#A78BFA"
    opacity=".48"
  />

  <circle
    cx="1031"
    cy="84"
    r="35"
    fill="#100822"
  />


  <!-- ===================================================== -->
  <!--                       HEADER                          -->
  <!-- ===================================================== -->

  <text
    x="600"
    y="45"
    text-anchor="middle"
    fill="#C084FC"
    font-family="monospace"
    font-size="30"
    font-weight="900"
    letter-spacing="2"
    filter="url(#softGlow)"
  >
    WORLD 01 // CODE KINGDOM
  </text>

  <text
    x="600"
    y="72"
    text-anchor="middle"
    fill="#A78BFA"
    font-family="monospace"
    font-size="11"
    letter-spacing="4"
  >
    COLLECTING COMMITS • LEVELING UP • BUILDING THE NEXT THING
  </text>


  <!-- ===================================================== -->
  <!--                    PLAYER PANEL                       -->
  <!-- ===================================================== -->

  <g transform="translate(34 28)">

    <rect
      width="190"
      height="60"
      rx="7"
      fill="#0D0619"
      stroke="#8B5CF6"
      stroke-width="2"
    />

    <text
      x="14"
      y="21"
      fill="#A78BFA"
      font-size="10"
      font-family="monospace"
      letter-spacing="2"
    >
      PLAYER
    </text>

    <text
      x="14"
      y="41"
      fill="#F5D0FE"
      font-size="16"
      font-family="monospace"
      font-weight="bold"
      letter-spacing="2"
    >
      THAAKIRAH
    </text>

    <text
      x="135"
      y="40"
      fill="#C084FC"
      font-size="18"
    >
      ♥ ♥ ♥
    </text>

  </g>


  <!-- ===================================================== -->
  <!--                    DRIFTING CLOUDS                    -->
  <!-- ===================================================== -->

  <g transform="translate(-120 90)">
    <use href="#cloud"/>
    <animateTransform
      attributeName="transform"
      type="translate"
      from="-120 90"
      to="1250 90"
      dur="27s"
      repeatCount="indefinite"
    />
  </g>

  <g transform="translate(350 125)" opacity=".7">
    <use href="#cloud" transform="scale(.7)"/>
    <animateTransform
      attributeName="transform"
      type="translate"
      from="350 125"
      to="1250 125"
      dur="35s"
      repeatCount="indefinite"
    />
  </g>

  <g transform="translate(850 85)" opacity=".85">
    <use href="#cloud" transform="scale(.8)"/>
    <animateTransform
      attributeName="transform"
      type="translate"
      from="850 85"
      to="-250 85"
      dur="31s"
      repeatCount="indefinite"
    />
  </g>


  <!-- ===================================================== -->
  <!--                    BACK MOUNTAINS                     -->
  <!-- ===================================================== -->

  <path
    d="
      M0 280
      L100 175
      L190 255
      L285 155
      L390 255
      L490 185
      L600 260
      L700 180
      L820 260
      L940 160
      L1060 260
      L1200 175
      L1200 330
      L0 330 Z
    "
    fill="url(#mountain)"
  />

  <path
    d="
      M0 305
      L120 230
      L215 295
      L320 215
      L410 290
      L525 240
      L630 300
      L760 230
      L860 300
      L980 220
      L1100 295
      L1200 245
      L1200 340
      L0 340 Z
    "
    fill="#090518"
    opacity=".8"
  />


  <!-- ===================================================== -->
  <!--                  FLOATING PLATFORMS                   -->
  <!-- ===================================================== -->

  <!-- platform 1 -->
  <g transform="translate(275 222)">
    <animateTransform
      attributeName="transform"
      type="translate"
      values="275 222;275 215;275 222"
      dur="3s"
      repeatCount="indefinite"
    />

    <use href="#brick"/>
    <use href="#brick" x="42"/>

    <rect x="84" width="42" height="28" rx="2" fill="#7C3AED"/>
    <rect x="88" y="4" width="34" height="20" fill="#8B5CF6"/>

    <text
      x="105"
      y="20"
      text-anchor="middle"
      fill="#F5D0FE"
      font-family="monospace"
      font-size="18"
      font-weight="900"
    >
      ?
    </text>

    <use href="#brick" x="126"/>
  </g>


  <!-- platform 2 -->
  <g transform="translate(510 185)">
    <animateTransform
      attributeName="transform"
      type="translate"
      values="510 185;510 178;510 185"
      dur="3.7s"
      repeatCount="indefinite"
    />

    <use href="#brick"/>
    <use href="#brick" x="42"/>

    <rect
      x="84"
      width="50"
      height="28"
      rx="2"
      fill="#5B21B6"
      stroke="#C084FC"
      stroke-width="2"
    />

    <text
      x="109"
      y="20"
      text-anchor="middle"
      fill="#F5D0FE"
      font-family="monospace"
      font-weight="bold"
      font-size="14"
    >
      &lt;/&gt;
    </text>

    <use href="#brick" x="134"/>
  </g>


  <!-- platform 3 -->
  <g transform="translate(885 220)">
    <animateTransform
      attributeName="transform"
      type="translate"
      values="885 220;885 212;885 220"
      dur="4.1s"
      repeatCount="indefinite"
    />

    <use href="#brick"/>
    <use href="#brick" x="42"/>
    <use href="#brick" x="84"/>
  </g>


  <!-- ===================================================== -->
  <!--                     COMMIT COINS                      -->
  <!-- ===================================================== -->

  <g transform="translate(320 185)">
    <use href="#commitCoin"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="320 185;320 173;320 185"
      dur="1.8s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="1;.78;1"
      dur="1.8s"
      repeatCount="indefinite"
    />
  </g>


  <g transform="translate(555 145)">
    <use href="#commitCoin"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="555 145;555 132;555 145"
      dur="1.6s"
      repeatCount="indefinite"
    />
  </g>


  <g transform="translate(610 145)">
    <use href="#commitCoin"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="610 145;610 134;610 145"
      dur="1.9s"
      repeatCount="indefinite"
    />
  </g>


  <g transform="translate(930 180)">
    <use href="#commitCoin"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="930 180;930 168;930 180"
      dur="1.7s"
      repeatCount="indefinite"
    />
  </g>


  <g transform="translate(985 180)">
    <use href="#commitCoin"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="985 180;985 166;985 180"
      dur="2s"
      repeatCount="indefinite"
    />
  </g>


  <!-- ===================================================== -->
  <!--                       PIPE                            -->
  <!-- ===================================================== -->

  <g transform="translate(735 232)">
    <rect
      x="12"
      y="0"
      width="55"
      height="78"
      fill="url(#pipe)"
      stroke="#67E8F9"
      stroke-width="3"
    />

    <rect
      x="0"
      y="-12"
      width="80"
      height="26"
      rx="3"
      fill="url(#pipe)"
      stroke="#67E8F9"
      stroke-width="3"
    />

    <rect
      x="20"
      y="4"
      width="8"
      height="69"
      fill="#67E8F9"
      opacity=".35"
    />
  </g>


  <!-- ===================================================== -->
  <!--                  ORIGINAL PIXEL HERO                  -->
  <!-- ===================================================== -->

  <g id="hero">

    <!-- hair -->
    <rect x="2" y="8" width="10" height="8" fill="#241037"/>
    <rect x="-2" y="14" width="8" height="12" fill="#241037"/>
    <rect x="12" y="10" width="7" height="12" fill="#241037"/>

    <!-- cap -->
    <rect x="2" y="3" width="14" height="6" fill="#6D28D9"/>
    <rect x="7" y="0" width="8" height="5" fill="#8B5CF6"/>
    <rect x="15" y="7" width="7" height="3" fill="#A78BFA"/>

    <!-- face -->
    <rect x="5" y="10" width="11" height="11" fill="#F4B183"/>
    <rect x="13" y="13" width="2" height="3" fill="#17111F"/>

    <!-- body -->
    <rect x="4" y="22" width="13" height="12" fill="#7C3AED"/>
    <rect x="1" y="25" width="6" height="5" fill="#A78BFA"/>
    <rect x="16" y="25" width="7" height="5" fill="#A78BFA"/>

    <!-- legs -->
    <rect x="5" y="34" width="5" height="8" fill="#3B1A68"/>
    <rect x="13" y="34" width="5" height="8" fill="#3B1A68"/>

    <!-- shoes -->
    <rect x="1" y="40" width="9" height="4" fill="#C084FC"/>
    <rect x="13" y="40" width="9" height="4" fill="#C084FC"/>

    <!-- motion -->
    <animateTransform
      attributeName="transform"
      type="translate"
      values="
        105 263;
        280 263;
        350 215;
        430 263;
        600 263;
        690 210;
        790 263;
        1000 263;
        1110 263
      "
      keyTimes="0;.18;.28;.36;.52;.62;.7;.9;1"
      dur="11s"
      repeatCount="indefinite"
    />

  </g>


  <!-- ===================================================== -->
  <!--                    FLAG / NEXT LEVEL                  -->
  <!-- ===================================================== -->

  <g transform="translate(1085 200)">

    <rect x="10" width="5" height="105" fill="#A78BFA"/>

    <path
      d="M15 5 H55 L45 20 L55 35 H15 Z"
      fill="#7C3AED"
      stroke="#C084FC"
      stroke-width="2"
    />

    <rect
      x="-20"
      y="85"
      width="80"
      height="40"
      rx="5"
      fill="#170C29"
      stroke="#8B5CF6"
      stroke-width="2"
    />

    <text
      x="20"
      y="102"
      text-anchor="middle"
      fill="#C084FC"
      font-family="monospace"
      font-size="10"
      letter-spacing="1"
    >
      NEXT
    </text>

    <text
      x="20"
      y="116"
      text-anchor="middle"
      fill="#F5D0FE"
      font-family="monospace"
      font-size="10"
      font-weight="bold"
    >
      LEVEL →
    </text>

  </g>


  <!-- ===================================================== -->
  <!--                       GROUND                          -->
  <!-- ===================================================== -->

  <rect x="0" y="305" width="1200" height="12" fill="url(#platformTop)"/>
  <rect x="0" y="317" width="1200" height="15" fill="#2D163B"/>

  <!-- pixel soil -->

  <g fill="#4C1D95">
    <rect x="0" y="332" width="40" height="22"/>
    <rect x="48" y="332" width="40" height="22"/>
    <rect x="96" y="332" width="40" height="22"/>
    <rect x="144" y="332" width="40" height="22"/>
    <rect x="192" y="332" width="40" height="22"/>
    <rect x="240" y="332" width="40" height="22"/>
    <rect x="288" y="332" width="40" height="22"/>
    <rect x="336" y="332" width="40" height="22"/>
    <rect x="384" y="332" width="40" height="22"/>
    <rect x="432" y="332" width="40" height="22"/>
    <rect x="480" y="332" width="40" height="22"/>
    <rect x="528" y="332" width="40" height="22"/>
    <rect x="576" y="332" width="40" height="22"/>
    <rect x="624" y="332" width="40" height="22"/>
    <rect x="672" y="332" width="40" height="22"/>
    <rect x="720" y="332" width="40" height="22"/>
    <rect x="768" y="332" width="40" height="22"/>
    <rect x="816" y="332" width="40" height="22"/>
    <rect x="864" y="332" width="40" height="22"/>
    <rect x="912" y="332" width="40" height="22"/>
    <rect x="960" y="332" width="40" height="22"/>
    <rect x="1008" y="332" width="40" height="22"/>
    <rect x="1056" y="332" width="40" height="22"/>
    <rect x="1104" y="332" width="40" height="22"/>
    <rect x="1152" y="332" width="40" height="22"/>
  </g>


  <!-- ===================================================== -->
  <!--                    COMMIT FUEL                        -->
  <!-- ===================================================== -->

  <text
    x="32"
    y="389"
    fill="#A78BFA"
    font-family="monospace"
    font-weight="bold"
    font-size="12"
    letter-spacing="2"
  >
    COMMIT FUEL
  </text>

  <rect
    x="135"
    y="377"
    width="190"
    height="15"
    rx="7"
    fill="#17111F"
    stroke="#6D28D9"
    stroke-width="2"
  />

  <rect
    x="139"
    y="381"
    width="0"
    height="7"
    rx="3"
    fill="#C084FC"
  >
    <animate
      attributeName="width"
      values="0;45;95;150;180;70;180"
      keyTimes="0;.15;.35;.55;.72;.83;1"
      dur="11s"
      repeatCount="indefinite"
    />
  </rect>


  <!-- ===================================================== -->
  <!--                      CAPTION                          -->
  <!-- ===================================================== -->

  <text
    x="600"
    y="390"
    text-anchor="middle"
    fill="#C084FC"
    font-family="monospace"
    font-size="13"
    font-weight="bold"
    letter-spacing="3"
  >
    SMALL COMMITS MAKE BIG DREAMS.
  </text>

  <text
    x="1160"
    y="390"
    text-anchor="end"
    fill="#A78BFA"
    font-family="monospace"
    font-size="12"
    font-weight="bold"
    letter-spacing="2"
  >
    LEVEL 01
  </text>

</svg>
