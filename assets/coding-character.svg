<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5c94fc"/>
      <stop offset="100%" stop-color="#9ccfff"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="400" height="300" fill="url(#sky)"/>

  <!-- sun -->
  <rect x="340" y="20" width="32" height="32" fill="#ffe14d"/>
  <rect x="336" y="24" width="4" height="24" fill="#ffe14d"/>
  <rect x="372" y="24" width="4" height="24" fill="#ffe14d"/>
  <rect x="352" y="8" width="24" height="4" fill="#ffe14d"/>
  <rect x="352" y="60" width="24" height="4" fill="#ffe14d"/>

  <!-- distant hills -->
  <g fill="#6fcf6f">
    <rect x="0" y="220" width="40" height="16"/>
    <rect x="8" y="212" width="24" height="8"/>
    <rect x="60" y="228" width="48" height="8"/>
    <rect x="72" y="220" width="24" height="8"/>
    <rect x="300" y="224" width="44" height="12"/>
    <rect x="312" y="216" width="20" height="8"/>
  </g>

  <!-- clouds, drifting -->
  <g fill="#ffffff" opacity="0.9">
    <g>
      <rect x="30" y="40" width="16" height="8"/>
      <rect x="22" y="48" width="40" height="8"/>
      <rect x="38" y="32" width="16" height="8"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 30 0; 0 0" dur="14s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="200" y="30" width="14" height="8"/>
      <rect x="192" y="38" width="34" height="8"/>
      <rect x="206" y="22" width="14" height="8"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -24 0; 0 0" dur="18s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- floating coin, spinning -->
  <g>
    <g transform="translate(230,150)">
      <rect x="-8" y="-12" width="16" height="24" fill="#ffd23f"/>
      <rect x="-4" y="-12" width="8" height="24" fill="#f5a623"/>
      <animateTransform attributeName="transform" type="scale" additive="sum" values="1 1; 0.15 1; 1 1" dur="1.4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- bushes -->
  <g fill="#3fae4f">
    <rect x="60" y="244" width="16" height="12"/>
    <rect x="76" y="248" width="16" height="8"/>
    <rect x="44" y="248" width="16" height="8"/>
    <rect x="300" y="244" width="16" height="12"/>
    <rect x="316" y="248" width="16" height="8"/>
  </g>

  <!-- ground -->
  <g>
    <rect x="0" y="252" width="400" height="10" fill="#7ed957"/>
    <rect x="0" y="262" width="400" height="38" fill="#a5652f"/>
    <g stroke="#8a4e26" stroke-width="2">
      <line x1="0" y1="278" x2="400" y2="278"/>
      <line x1="20" y1="262" x2="20" y2="278"/>
      <line x1="60" y1="262" x2="60" y2="278"/>
      <line x1="100" y1="262" x2="100" y2="278"/>
      <line x1="140" y1="262" x2="140" y2="278"/>
      <line x1="180" y1="262" x2="180" y2="278"/>
      <line x1="220" y1="262" x2="220" y2="278"/>
      <line x1="260" y1="262" x2="260" y2="278"/>
      <line x1="300" y1="262" x2="300" y2="278"/>
      <line x1="340" y1="262" x2="340" y2="278"/>
      <line x1="380" y1="262" x2="380" y2="278"/>
      <line x1="40" y1="278" x2="40" y2="294"/>
      <line x1="80" y1="278" x2="80" y2="294"/>
      <line x1="120" y1="278" x2="120" y2="294"/>
      <line x1="160" y1="278" x2="160" y2="294"/>
      <line x1="200" y1="278" x2="200" y2="294"/>
      <line x1="240" y1="278" x2="240" y2="294"/>
      <line x1="280" y1="278" x2="280" y2="294"/>
      <line x1="320" y1="278" x2="320" y2="294"/>
      <line x1="360" y1="278" x2="360" y2="294"/>
    </g>
  </g>

  <!-- ===== hero sprite ===== -->
  <g transform="translate(150,140)">
    <!-- idle bob -->
    <animateTransform attributeName="transform" type="translate"
      values="150 140; 150 136; 150 140" dur="0.9s" repeatCount="indefinite" additive="sum"/>

    <!-- cap -->
    <rect x="24" y="0" width="32" height="8" fill="#2e6fdb"/>
    <rect x="16" y="8" width="48" height="8" fill="#2e6fdb"/>
    <rect x="36" y="8" width="8" height="8" fill="#ffd23f"/>

    <!-- hair + face -->
    <rect x="16" y="16" width="8" height="8" fill="#3a2c26"/>
    <rect x="56" y="16" width="8" height="8" fill="#3a2c26"/>
    <rect x="24" y="16" width="32" height="16" fill="#e8b48a"/>
    <rect x="30" y="26" width="6" height="6" fill="#2b2b2b"/>
    <rect x="44" y="26" width="6" height="6" fill="#2b2b2b"/>

    <!-- collar -->
    <rect x="24" y="32" width="32" height="8" fill="#2fae5c"/>

    <!-- arms -->
    <rect x="8" y="40" width="8" height="24" fill="#2fae5c"/>
    <rect x="8" y="64" width="8" height="8" fill="#e8b48a"/>
    <rect x="64" y="40" width="8" height="24" fill="#2fae5c"/>
    <rect x="64" y="64" width="8" height="8" fill="#e8b48a"/>

    <!-- torso -->
    <rect x="16" y="40" width="48" height="32" fill="#2fae5c"/>
    <rect x="16" y="72" width="48" height="8" fill="#6b4423"/>

    <!-- legs, two-frame walk cycle -->
    <g>
      <rect x="24" y="80" width="16" height="24" fill="#d8b26a">
        <animate attributeName="height" values="24;16;24" dur="0.6s" repeatCount="indefinite" calcMode="discrete"/>
      </rect>
      <rect x="40" y="80" width="16" height="24" fill="#d8b26a">
        <animate attributeName="height" values="16;24;16" dur="0.6s" repeatCount="indefinite" calcMode="discrete"/>
      </rect>
      <rect x="20" y="104" width="20" height="8" fill="#5a3a1e">
        <animate attributeName="y" values="104;96;104" dur="0.6s" repeatCount="indefinite" calcMode="discrete"/>
      </rect>
      <rect x="40" y="96" width="20" height="8" fill="#5a3a1e">
        <animate attributeName="y" values="96;104;96" dur="0.6s" repeatCount="indefinite" calcMode="discrete"/>
      </rect>
    </g>
  </g>
</svg>
